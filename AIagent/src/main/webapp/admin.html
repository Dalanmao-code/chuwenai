<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楚镜AI — 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
    <div class="admin-header">
        <h1>楚镜AI · 管理后台</h1>
        <p>查看所有用户的 AI 消耗统计</p>
        <a href="chat.html" class="back-btn">&#8592; 返回对话</a>
    </div>

    <div class="admin-content">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card purple">
                <div class="card-icon">&#128101;</div>
                <div class="card-value" id="statUsers">0</div>
                <div class="card-label">总用户数</div>
            </div>
            <div class="stat-card blue">
                <div class="card-icon">&#128172;</div>
                <div class="card-value" id="statConvs">0</div>
                <div class="card-label">总对话数</div>
            </div>
            <div class="stat-card green">
                <div class="card-icon">&#9889;</div>
                <div class="card-value" id="statTotalTokens">0</div>
                <div class="card-label">总 Token 消耗</div>
            </div>
            <div class="stat-card orange">
                <div class="card-icon">&#128200;</div>
                <div class="card-value" id="statTodayTokens">0</div>
                <div class="card-label">今日消耗</div>
            </div>
        </div>

        <div class="stats-table-wrap">
            <h2>用户消耗详情</h2>
            <table>
                <thead>
                    <tr>
                        <th>用户 ID</th>
                        <th>用户名</th>
                        <th>对话数</th>
                        <th>API 调用次数</th>
                        <th>Token 消耗</th>
                        <th>消耗占比</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6" style="text-align:center;color:#b2bec3;padding:40px;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
