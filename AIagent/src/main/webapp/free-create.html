<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楚镜AI — 自由创作</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div class="patterns-layout">
    <!-- 左侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand"><img src="images/logo.png" alt="" class="sidebar-logo-inline" width="30" height="30">楚镜 AI</div>
            <small>非遗纹样 · 传承创新</small>
        </div>

        <div class="sidebar-user">
            <div class="user-avatar" id="sidebarAvatar"></div>
            <div class="user-info">
                <div class="name" id="sidebarName"></div>
                <span class="role-tag">用户</span>
            </div>
        </div>

        <div class="sidebar-nav">
            <a class="nav-item" href="home.html">
                <span class="nav-icon">&#127968;</span> 主页
            </a>
            <a class="nav-item" href="patterns-library.html">
                <span class="nav-icon">&#128218;</span> 纹样库
            </a>
            <a class="nav-item" href="chat.html">
                <span class="nav-icon">&#128172;</span> 灵感顾问
            </a>
            <a class="nav-item" href="patterns.html">
                <span class="nav-icon">&#127912;</span> AI设计师
            </a>
            <a class="nav-item" href="ai-video.html">
                <span class="nav-icon">&#127916;</span> AI视频
            </a>
            <div class="nav-item active">
                <span class="nav-icon">&#127917;</span> 自由创作
            </div>
            <a class="nav-item" href="product-showcase.html">
                <span class="nav-icon">&#128230;</span> 产品展示
            </a>
            <a class="nav-item" href="member-center.html">
                <span class="nav-icon">&#128100;</span> 会员中心
            </a>
        </div>

        <div class="sidebar-footer" style="margin-top:auto;">
            <button onclick="handleLogout()">&#10149; 退出</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="patterns-main">
        <div class="patterns-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
                <span class="brand">自由创作</span>
            </div>
            <!-- 模式切换放在 header 右边 -->
            <div class="free-mode-toggle" id="modeToggle">
                <button class="free-mode-btn active" id="modeRefBtn" onclick="switchMode('ref')">
                    参考图创作
                </button>
                <span class="free-mode-divider">|</span>
                <button class="free-mode-btn" id="modeTextBtn" onclick="switchMode('text')">
                    纯文字创作
                </button>
            </div>
        </div>

        <div class="free-create-body">
            <!-- 上传/预览区（参考图模式） -->
            <div id="uploadSection">
                <div class="creation-panel">
                    <div class="section-title">一、上传参考图片</div>
                    <div class="preview-area">
                        <div class="preview-box" style="cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                            <div id="noUpload" style="padding:80px 60px;color:var(--text-light);font-family:var(--font-heading);font-size:14px;letter-spacing:2px;text-align:center;">
                                <div style="font-size:48px;margin-bottom:12px;">&#128247;</div>
                                <p>点击此处上传参考图片</p>
                                <p style="font-size:11px;margin-top:6px;color:var(--text-light);opacity:0.7;">支持 JPG、PNG，不超过 20MB</p>
                            </div>
                            <img id="uploadPreview" style="display:none;width:100%;" alt="预览">
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" onchange="handleFileSelect(event)" style="display:none;">
                    <button id="uploadClearBtn" class="btn-upload-clear" style="display:none;" onclick="clearUpload()">清除图片</button>
                </div>
            </div>

            <div class="divider-ornament">◇ 回 ◇ 纹 ◇</div>

            <!-- 提示词输入 -->
            <div class="creation-panel">
                <div class="section-title" id="promptSectionTitle">二、描述创作效果</div>
                <div class="prompt-input-area">
                    <label for="promptInput">你想要创作什么样的纹样？</label>
                    <textarea id="promptInput" placeholder="例如：一只金色凤凰在云纹背景中展翅，配色以红金为主，带有楚文化风格..."></textarea>
                </div>
            </div>

            <button class="btn-generate" id="generateBtn" onclick="generateImage()">
                生成作品
            </button>

            <div class="divider-ornament">◇ 回 ◇ 纹 ◇</div>

            <!-- 生成结果 -->
            <div class="creation-panel">
                <div class="section-title">创作结果</div>
                <div class="result-area" id="resultArea">
                    <div class="result-box">
                        <div class="no-result" id="noResult">
                            生成后的作品将在此展示
                        </div>
                        <img id="resultImage" style="display:none;" alt="生成作品">
                    </div>
                    <div class="result-actions" id="resultActions" style="display:none;">
                        <button class="btn-download" onclick="downloadImage()">
                            &#128229; 下载作品
                        </button>
                    </div>
                </div>
                <div class="generating-indicator" id="generatingIndicator" style="display:none;">
                    <div class="progress-bar-wrap">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <span>作品生成中，请稍候...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script>
var currentMode = 'ref';
var uploadedBase64 = null;
var lastGeneratedBase64 = null;
var progressTimer = null;

(async function init() {
    try {
        var user = await API.getUserInfo();
        document.getElementById('sidebarName').textContent = user.displayName || user.username;
        var avatar = document.getElementById('sidebarAvatar');
        avatar.style.background = user.avatarColor || '#C53D43';
        avatar.textContent = (user.displayName || user.username).charAt(0).toUpperCase();
    } catch (e) {
        window.location.href = 'index.html';
    }
})();

function switchMode(mode) {
    currentMode = mode;
    var refBtn = document.getElementById('modeRefBtn');
    var textBtn = document.getElementById('modeTextBtn');
    var uploadSection = document.getElementById('uploadSection');
    var promptTitle = document.getElementById('promptSectionTitle');

    if (mode === 'ref') {
        refBtn.classList.add('active');
        textBtn.classList.remove('active');
        uploadSection.style.display = '';
        promptTitle.textContent = '二、描述创作效果';
    } else {
        textBtn.classList.add('active');
        refBtn.classList.remove('active');
        uploadSection.style.display = 'none';
        promptTitle.textContent = '一、描述创作效果';
    }
}

function handleFileSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { showToast('图片大小不能超过20MB', 'error'); return; }

    var reader = new FileReader();
    reader.onload = function(e) {
        uploadedBase64 = e.target.result;
        if (uploadedBase64.indexOf('base64,') !== -1) {
            uploadedBase64 = uploadedBase64.split('base64,')[1];
        }
        var preview = document.getElementById('uploadPreview');
        preview.src = 'data:image/png;base64,' + uploadedBase64;
        preview.style.display = 'block';
        document.getElementById('noUpload').style.display = 'none';
        document.getElementById('uploadClearBtn').style.display = 'inline-flex';
    };
    reader.readAsDataURL(file);
}

function clearUpload() {
    uploadedBase64 = null;
    document.getElementById('uploadPreview').style.display = 'none';
    document.getElementById('noUpload').style.display = '';
    document.getElementById('uploadClearBtn').style.display = 'none';
    document.getElementById('fileInput').value = '';
}

function startProgressBar() {
    var fill = document.getElementById('progressFill');
    fill.style.animation = 'none';
    fill.style.width = '0%';
    var percent = 0;
    clearInterval(progressTimer);
    progressTimer = setInterval(function() {
        percent += (90 - percent) * 0.08 + 0.3;
        if (percent >= 89.5) percent = 89.5;
        fill.style.width = percent + '%';
    }, 300);
}

function finishProgressBar() {
    clearInterval(progressTimer);
    var fill = document.getElementById('progressFill');
    fill.style.width = '100%';
    setTimeout(function() { fill.style.width = '0%'; }, 600);
}

async function generateImage() {
    var prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) { showToast('请输入创作描述', 'error'); return; }
    if (currentMode === 'ref' && !uploadedBase64) {
        showToast('请先上传一张参考图片，或切换到纯文字创作模式', 'error'); return;
    }

    var btn = document.getElementById('generateBtn');
    var indicator = document.getElementById('generatingIndicator');
    var noResult = document.getElementById('noResult');
    var resultImg = document.getElementById('resultImage');
    var resultActions = document.getElementById('resultActions');

    btn.disabled = true;
    btn.textContent = '生成中...';
    indicator.style.display = 'flex';
    noResult.style.display = 'none';
    resultImg.style.display = 'none';
    resultActions.style.display = 'none';
    startProgressBar();

    try {
        var result;
        if (currentMode === 'ref' && uploadedBase64) {
            result = await API.generateImageWithBase64(prompt, uploadedBase64);
        } else {
            result = await API.generateImage(prompt, null);
        }
        lastGeneratedBase64 = result.imageBase64;
        finishProgressBar();
        resultImg.src = 'data:image/png;base64,' + result.imageBase64;
        resultImg.style.display = 'block';
        resultActions.style.display = 'flex';
        noResult.style.display = 'none';
        showToast('作品生成成功！', 'success');
    } catch (e) {
        clearInterval(progressTimer);
        showToast('生成失败: ' + e.message, 'error');
        noResult.style.display = 'block';
        noResult.textContent = '生成失败，请稍后重试';
    }

    btn.disabled = false;
    btn.textContent = '生成作品';
    indicator.style.display = 'none';
}

function downloadImage() {
    if (!lastGeneratedBase64) { showToast('没有可下载的作品', 'error'); return; }
    var link = document.createElement('a');
    link.download = '创作_' + new Date().toISOString().slice(0, 10) + '.png';
    link.href = 'data:image/png;base64,' + lastGeneratedBase64;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    showToast('下载成功', 'success');
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

async function handleLogout() {
    try { await API.logout(); } catch (e) {}
    window.location.href = 'index.html';
}

function showToast(msg, type) {
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'info');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() { t.remove(); }, 3000);
}
</script>
</body>
</html>
